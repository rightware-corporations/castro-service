name: Public Spaces Explorer Configurator

on:
  push:
    branches:
      - feat/public-spaces-explorer-configurator

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/public-spaces-explorer-configurator
          fetch-depth: 0

      - name: Implement Explorer and Configurator quality pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('frontend/src/features/spaces/components/SpacesPublic.tsx')
          text = component.read_text(encoding='utf-8')
          text = text.replace("variant: 'catalog' | 'detail'", "variant: 'catalog' | 'detail' | 'config'", 1)
          text = text.replace("const prefix = variant === 'detail' ? 'space-detail-v2' : 'space-v2-card'", "const prefix = variant === 'detail' ? 'space-detail-v2' : variant === 'config' ? 'space-config-v2' : 'space-v2-card'", 1)
          text = text.replace("const label = variant === 'detail' ? 'EXPERIÊNCIA ESPACIAL' : `ESPAÇO ${String((index ?? 0) + 1).padStart(2, '0')}`", "const label = variant === 'detail' ? 'EXPERIÊNCIA ESPACIAL' : variant === 'config' ? 'PRÉ-VISUALIZAÇÃO' : `ESPAÇO ${String((index ?? 0) + 1).padStart(2, '0')}`", 1)

          start = text.index('export function SpaceExplorer()')
          end = text.index('function yawPercent', start)
          replacement = r'''export function SpaceExplorer() {
            const { slug } = useParams()
            const query = useSpace(slug)
            const [infoOpen, setInfoOpen] = useState(false)
            const [selectedSceneId, setSelectedSceneId] = useState('')
            const [activeHotspotId, setActiveHotspotId] = useState('')
            const [zoom, setZoom] = useState(1)
            const canvasRef = useRef<HTMLDivElement>(null)
            const infoTriggerRef = useRef<HTMLButtonElement>(null)
            const spaceId = query.data?.id ?? ''
            const scenes = useQuery({ queryKey: ['public', 'spaces', spaceId, 'scenes'], queryFn: () => spacePublicExperience.listScenes(spaceId), enabled: Boolean(spaceId) })
            const scene = scenes.data?.find((item) => item.id === selectedSceneId) ?? scenes.data?.[0]
            const sceneId = scene?.id ?? ''
            const hotspots = useQuery({ queryKey: ['public', 'spaces', spaceId, 'scenes', sceneId, 'hotspots'], queryFn: () => spacePublicExperience.listHotspots(spaceId, sceneId), enabled: Boolean(spaceId && sceneId) })
            const activeHotspot = (hotspots.data ?? []).find((item) => item.id === activeHotspotId)

            useEffect(() => { setActiveHotspotId('') }, [sceneId])
            useEffect(() => {
              if (!infoOpen) return
              const onKeyDown = (event: KeyboardEvent) => {
                if (event.key !== 'Escape') return
                setInfoOpen(false)
                infoTriggerRef.current?.focus()
              }
              document.addEventListener('keydown', onKeyDown)
              return () => document.removeEventListener('keydown', onKeyDown)
            }, [infoOpen])

            if (query.isLoading) return <section className="public-page container"><LoadingState label="A preparar o explorador." /></section>
            if (query.isError || !query.data) return <section className="public-page container"><ErrorState title="Não foi possível abrir este espaço." /></section>
            const space = query.data
            const selectScene = (id: string) => { setSelectedSceneId(id); setZoom(1) }
            const nextScene = () => {
              const items = scenes.data ?? []
              if (!items.length) return
              const current = Math.max(items.findIndex((item) => item.id === scene?.id), 0)
              selectScene(items[(current + 1) % items.length].id)
            }
            const fullScreen = () => { void canvasRef.current?.requestFullscreen?.() }
            const closeInfo = () => { setInfoOpen(false); infoTriggerRef.current?.focus() }
            const sceneCount = scenes.data?.length ?? 0

            return <div className="space-explorer-v2">
              <div className="space-explorer-v2__top"><Link to={`/espacos/${space.slug}`}><ArrowLeft size={16} />Voltar</Link><span>{space.name}</span><button ref={infoTriggerRef} type="button" onClick={() => setInfoOpen((value) => !value)} aria-expanded={infoOpen} aria-controls="space-explorer-information">Informação</button></div>
              <div ref={canvasRef} className="space-explorer-v2__canvas" aria-label="Explorador panorâmico do espaço">
                {scenes.isLoading && <LoadingState label="A carregar cenas do espaço." />}
                {scenes.isError && <ErrorState title="Não foi possível carregar as cenas deste espaço." />}
                {!scenes.isLoading && !scenes.isError && !scene && <div className="space-explorer-v2__empty"><span className="eyebrow eyebrow--light">EXPLORADOR</span><strong>Panorama ainda não publicado.</strong><p>O explorador ficará disponível quando existir uma cena real publicada para este espaço.</p></div>}
                {scene && <>
                  <img className="space-explorer-v2__panorama" src={scene.panoramaUrl} alt={scene.title ? `Panorama: ${scene.title}` : `Panorama de ${space.name}`} draggable={false} style={{ transform: `scale(${zoom})` }} />
                  <div className="space-explorer-v2__scene-label" aria-live="polite"><span>{scene.title || 'CENA PANORÂMICA'}</span><small>{sceneCount} {sceneCount === 1 ? 'cena publicada' : 'cenas publicadas'}</small></div>
                  {(hotspots.data ?? []).map((hotspot) => <button key={hotspot.id} className={`space-explorer-v2__hotspot ${activeHotspotId === hotspot.id ? 'is-active' : ''}`} type="button" aria-label={hotspot.targetSceneId ? `${hotspot.title}. Abrir outra cena.` : `${hotspot.title}. Ver informação.`} onClick={() => hotspot.targetSceneId ? selectScene(hotspot.targetSceneId) : setActiveHotspotId((value) => value === hotspot.id ? '' : hotspot.id)} style={{ left: `${yawPercent(hotspot.yaw)}%`, top: `${pitchPercent(hotspot.pitch)}%` }}><span aria-hidden="true">{hotspot.targetSceneId ? '↗' : 'i'}</span></button>)}
                  {activeHotspot && <div className="space-explorer-v2__hotspot-card" role="status"><span className="eyebrow eyebrow--light">PONTO DO ESPAÇO</span><strong>{activeHotspot.title}</strong>{activeHotspot.description && <p>{activeHotspot.description}</p>}{activeHotspot.resourceName && <small>{activeHotspot.resourceName}</small>}<button type="button" onClick={() => setActiveHotspotId('')}>Fechar</button></div>}
                  {sceneCount > 1 && <nav className="space-explorer-v2__scenes" aria-label="Cenas publicadas">{(scenes.data ?? []).map((item, index) => <button key={item.id} type="button" aria-pressed={item.id === scene.id} onClick={() => selectScene(item.id)}><span>{String(index + 1).padStart(2, '0')}</span><strong>{item.title || `Cena ${index + 1}`}</strong></button>)}</nav>}
                </>}
                <div className="space-explorer-v2__controls" aria-label="Controlos do explorador"><button type="button" aria-label="Cena seguinte" onClick={nextScene} disabled={sceneCount < 2}><RotateCw size={18} /></button><button type="button" aria-label="Aumentar zoom" onClick={() => setZoom((value) => Math.min(2, value + 0.15))} disabled={!scene || zoom >= 2}><Plus size={18} /></button><button type="button" aria-label="Diminuir zoom" onClick={() => setZoom((value) => Math.max(1, value - 0.15))} disabled={!scene || zoom <= 1}><Minus size={18} /></button><button type="button" aria-label="Ecrã inteiro" onClick={fullScreen}><Maximize2 size={18} /></button></div>
                <div className="space-explorer-v2__hint"><Expand size={15} /><span>{scene ? 'Use os pontos publicados para conhecer detalhes ou mudar de cena.' : 'Sem panorama publicado.'}</span></div>
              </div>
              {infoOpen && <aside id="space-explorer-information" className="space-explorer-v2__info" aria-label={`Informação sobre ${space.name}`}><button type="button" onClick={closeInfo} aria-label="Fechar informação">Fechar</button><span className="eyebrow">SOBRE O ESPAÇO</span><h2>{space.name}</h2><p>{space.description ?? 'Conteúdo detalhado pendente.'}</p><div><small>Capacidade</small><strong>{formatCapacity(space)}</strong></div>{space.location && <div><small>Localização</small><strong>{space.location}</strong></div>}{scene && <div><small>Cena atual</small><strong>{scene.title || 'Sem título'}</strong></div>}<Link className="ds-button ds-button--primary" to={`/espacos/${space.slug}/configurar`}>Configurar este espaço <ArrowRight size={16} /></Link></aside>}
            </div>
          }

          export function SpaceConfigurator() {
            const { slug } = useParams()
            const query = useSpace(slug)
            const navigate = useNavigate()
            const [searchParams, setSearchParams] = useSearchParams()
            const [purpose, setPurpose] = useState(parsePurpose(searchParams.get('purpose')))
            const initialPeople = parsePeople(searchParams.get('people'))
            const [people, setPeople] = useState<number | ''>(initialPeople)

            useEffect(() => {
              const next = new URLSearchParams(searchParams)
              if (purpose) next.set('purpose', purpose); else next.delete('purpose')
              if (people !== '') next.set('people', String(people)); else next.delete('people')
              if (next.toString() !== searchParams.toString()) setSearchParams(next, { replace: true })
            }, [people, purpose, searchParams, setSearchParams])

            if (query.isLoading) return <section className="public-page container"><LoadingState label="A preparar configuração." /></section>
            if (query.isError || !query.data) return <section className="public-page container"><ErrorState title="Não foi possível configurar este espaço." /></section>
            const space = query.data
            const peopleTooLow = typeof people === 'number' && people < 1
            const peopleTooHigh = typeof people === 'number' && space.capacityMax !== undefined && people > space.capacityMax
            const peopleInvalid = peopleTooLow || peopleTooHigh
            const peopleError = peopleTooLow ? 'O número de participantes deve ser pelo menos 1.' : peopleTooHigh ? `O valor ultrapassa a capacidade publicada de ${space.capacityMax}.` : ''
            const purposeLabel = purposeOptions.find((item) => item.value === purpose)?.label
            const bookingParams = new URLSearchParams()
            if (purpose) bookingParams.set('purpose', purpose)
            if (people !== '') bookingParams.set('people', String(people))
            const bookingHref = `${bookingRoute('SPACE', space.id, 'selection')}?${bookingParams.toString()}`

            return <div className="space-config-v2">
              <section className="container space-config-v2__header"><Breadcrumbs items={[{ label: 'Espaços', href: '/espacos' }, { label: space.name, href: `/espacos/${space.slug}` }, { label: 'Configurar' }]} /><div><span className="eyebrow">CONFIGURAR ESPAÇO</span><h1>Prepare o encontro <em>à sua maneira.</em></h1><p>Escolha apenas o que já pode ser definido sem assumir layouts ou equipamentos ainda não publicados.</p></div></section>
              <section className="container space-config-v2__layout">
                <div className="space-config-v2__controls">
                  <div className="space-config-v2__section"><div className="space-config-v2__section-title"><span>01</span><div><h2>Qual é o tipo de encontro?</h2><p>Esta escolha descreve a intenção; não altera regras comerciais.</p></div></div><div className="space-config-v2__purpose">{purposeOptions.map(({ value, label, icon: Icon }) => <button className={purpose === value ? 'is-selected' : ''} key={value} type="button" onClick={() => setPurpose(value)} aria-pressed={purpose === value}><Icon size={19} /><span>{label}</span><ArrowUpRight size={15} /></button>)}</div></div>
                  <div className="space-config-v2__section"><div className="space-config-v2__section-title"><span>02</span><div><h2>Quantas pessoas?</h2><p>{space.capacityMax !== undefined ? `O espaço publicado indica capacidade máxima de ${space.capacityMax}.` : 'Indique o número previsto de participantes.'}</p></div></div><label className="space-config-v2__people"><span>Participantes</span><input type="number" min="1" max={space.capacityMax} value={people} onChange={(event) => setPeople(event.target.value === '' ? '' : Number(event.target.value))} aria-invalid={peopleInvalid} aria-describedby={peopleInvalid ? 'space-config-people-error' : undefined} />{peopleInvalid && <small id="space-config-people-error">{peopleError}</small>}</label></div>
                  <div className="space-config-v2__section space-config-v2__pending"><div className="space-config-v2__section-title"><span>03</span><div><h2>Layout & recursos</h2><p>As opções serão apresentadas quando existirem configurações reais publicadas para este espaço.</p><small className="space-config-v2__pending-label">AINDA NÃO PUBLICADO</small></div></div></div>
                </div>
                <aside className="space-config-v2__summary"><SpaceMediaPreview space={space} variant="config" /><span className="eyebrow">RESUMO</span><h2>{space.name}</h2><dl><div><dt>Finalidade</dt><dd>{purposeLabel ?? 'A escolher'}</dd></div><div><dt>Participantes</dt><dd>{people === '' ? 'A indicar' : people}</dd></div><div><dt>Capacidade</dt><dd>{formatCapacity(space)}</dd></div></dl><Button disabled={!purpose || people === '' || peopleInvalid} onClick={() => navigate(bookingHref)}>Ver disponibilidade <ArrowRight size={16} /></Button><small>A disponibilidade será calculada pelo sistema no próximo passo.</small></aside>
              </section>
            </div>
          }

          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace("function parsePeople(value: string | null): number | '' {", "function parsePurpose(value: string | null) {\n  return purposeOptions.some((option) => option.value === value) ? value ?? '' : ''\n}\n\nfunction parsePeople(value: string | null): number | '' {", 1)
          component.write_text(text, encoding='utf-8')

          test = Path('frontend/src/features/spaces/components/SpacesPublic.test.tsx')
          test.write_text('''import { QueryClient, QueryClientProvider } from '@tanstack/react-query'\nimport { fireEvent, render, screen } from '@testing-library/react'\nimport { MemoryRouter } from 'react-router-dom'\nimport { beforeEach, describe, expect, it, vi } from 'vitest'\nimport { SpaceConfigurator, SpaceDetail, SpacesCatalog } from './SpacesPublic'\n\nconst hookMocks = vi.hoisted(() => ({\n  useSpaces: vi.fn(),\n  useSpace: vi.fn(),\n}))\n\nvi.mock('../hooks', () => ({\n  useSpaces: hookMocks.useSpaces,\n  useSpace: hookMocks.useSpace,\n}))\n\nconst space = {\n  id: 'space-1',\n  slug: 'sala-reuniao',\n  name: 'Sala de Reunião',\n  description: 'Espaço publicado para reuniões.',\n  location: 'Maputo',\n  capacityMin: 2,\n  capacityMax: 10,\n}\n\nfunction renderWithQuery(element: React.ReactElement) {\n  const queryClient = new QueryClient({ defaultOptions: { queries: { retry: false } } })\n  return render(<QueryClientProvider client={queryClient}>{element}</QueryClientProvider>)\n}\n\ndescribe('public spaces navigation', () => {\n  beforeEach(() => {\n    hookMocks.useSpaces.mockReset()\n    hookMocks.useSpace.mockReset()\n  })\n\n  it('links each published space to its detail and explorer routes', () => {\n    hookMocks.useSpaces.mockReturnValue({ isLoading: false, isError: false, data: { items: [space] } })\n    renderWithQuery(<MemoryRouter><SpacesCatalog /></MemoryRouter>)\n    expect(screen.getByRole('link', { name: /Conhecer espaço/i })).toHaveAttribute('href', '/espacos/sala-reuniao')\n    expect(screen.getByRole('link', { name: /^Explorar/i })).toHaveAttribute('href', '/espacos/sala-reuniao/explorar')\n  })\n\n  it('keeps the detail page connected to explorer, configurator and catalog routes', () => {\n    hookMocks.useSpace.mockReturnValue({ isLoading: false, isError: false, data: space })\n    renderWithQuery(<MemoryRouter initialEntries={['/espacos/sala-reuniao']}><SpaceDetail /></MemoryRouter>)\n    expect(screen.getByRole('link', { name: 'Espaços' })).toHaveAttribute('href', '/espacos')\n    expect(screen.getByRole('link', { name: /Explorar espaço/i })).toHaveAttribute('href', '/espacos/sala-reuniao/explorar')\n    expect(screen.getByRole('link', { name: /Configurar encontro/i })).toHaveAttribute('href', '/espacos/sala-reuniao/configurar')\n  })\n\n  it('blocks invalid participant counts before booking', () => {\n    hookMocks.useSpace.mockReturnValue({ isLoading: false, isError: false, data: space })\n    renderWithQuery(<MemoryRouter initialEntries={['/espacos/sala-reuniao/configurar']}><SpaceConfigurator /></MemoryRouter>)\n    fireEvent.click(screen.getByRole('button', { name: /Reunião/i }))\n    const input = screen.getByLabelText('Participantes')\n    const proceed = screen.getByRole('button', { name: /Ver disponibilidade/i })\n    fireEvent.change(input, { target: { value: '0' } })\n    expect(screen.getByText(/pelo menos 1/i)).toBeInTheDocument()\n    expect(proceed).toBeDisabled()\n    fireEvent.change(input, { target: { value: '11' } })\n    expect(screen.getByText(/capacidade publicada de 10/i)).toBeInTheDocument()\n    expect(proceed).toBeDisabled()\n    fireEvent.change(input, { target: { value: '6' } })\n    expect(proceed).toBeEnabled()\n  })\n\n  it('does not trust an unknown purpose from the URL', () => {\n    hookMocks.useSpace.mockReturnValue({ isLoading: false, isError: false, data: space })\n    renderWithQuery(<MemoryRouter initialEntries={['/espacos/sala-reuniao/configurar?purpose=unknown&people=4']}><SpaceConfigurator /></MemoryRouter>)\n    expect(screen.getByText('A escolher')).toBeInTheDocument()\n    expect(screen.getByRole('button', { name: /Ver disponibilidade/i })).toBeDisabled()\n  })\n})\n''', encoding='utf-8')

          css_path = Path('frontend/src/styles/spaces-v2.css')
          css = css_path.read_text(encoding='utf-8')
          css_start = css.index('/* Explorer intentionally breaks out of the public container. */')
          css_end = css.index('@media (max-width: 1000px)', css_start)
          core = r'''/* Explorer intentionally breaks out of the public container. */
          .space-explorer-v2 { position: relative; min-height: calc(100vh - 5.65rem); overflow: hidden; background: var(--color-deep-navy); color: #fff; }
          .space-explorer-v2__top { position: absolute; z-index: 20; top: 0; right: 0; left: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 4.4rem; border-bottom: 1px solid rgb(255 255 255 / 14%); background: rgb(16 19 59 / 88%); backdrop-filter: blur(14px); padding: 0 clamp(1rem, 3vw, 2.2rem); }
          .space-explorer-v2__top a, .space-explorer-v2__top button { display: inline-flex; align-items: center; gap: .45rem; min-height: var(--touch-target); border: 0; background: transparent; color: #fff; font-size: .72rem; font-weight: 700; text-decoration: none; }
          .space-explorer-v2__top > span { font-family: var(--font-editorial); font-size: 1.2rem; }
          .space-explorer-v2__top button { justify-self: end; cursor: pointer; }
          .space-explorer-v2__canvas { position: relative; min-height: calc(100vh - 5.65rem); overflow: hidden; background: #0d1027; isolation: isolate; }
          .space-explorer-v2__panorama { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; transform-origin: center; transition: transform var(--motion-fast) var(--ease-standard); user-select: none; }
          .space-explorer-v2__empty { position: absolute; z-index: 4; left: clamp(1.5rem, 6vw, 6rem); bottom: clamp(5.5rem, 10vw, 8rem); max-width: 40rem; }
          .space-explorer-v2__empty strong { display: block; max-width: 9ch; margin: .8rem 0 1rem; font-family: var(--font-editorial); font-size: clamp(3.5rem, 6vw, 6.7rem); font-weight: 400; line-height: .92; }
          .space-explorer-v2__empty p { max-width: 33rem; color: rgb(255 255 255 / 62%); line-height: 1.8; }
          .space-explorer-v2__scene-label { position: absolute; z-index: 5; top: 6rem; left: clamp(1.5rem, 4vw, 3.5rem); display: grid; gap: .25rem; border-left: 2px solid var(--color-teal); background: rgb(16 19 59 / 68%); padding: .65rem .9rem; backdrop-filter: blur(10px); }
          .space-explorer-v2__scene-label span { font-size: .68rem; font-weight: 850; letter-spacing: .13em; }
          .space-explorer-v2__scene-label small { color: rgb(255 255 255 / 62%); font-size: .62rem; }
          .space-explorer-v2__hotspot { position: absolute; z-index: 7; display: grid; width: 2.35rem; height: 2.35rem; place-items: center; transform: translate(-50%, -50%); border: 1px solid rgb(255 255 255 / 82%); border-radius: 50%; background: rgb(16 19 59 / 82%); color: #fff; font-weight: 850; cursor: pointer; box-shadow: 0 0 0 .45rem rgb(16 19 59 / 18%); }
          .space-explorer-v2__hotspot:hover, .space-explorer-v2__hotspot.is-active { border-color: var(--color-teal); background: var(--color-teal); color: var(--color-deep-navy); }
          .space-explorer-v2__hotspot-card { position: absolute; z-index: 9; left: clamp(1.5rem, 4vw, 3.5rem); bottom: 8.5rem; width: min(24rem, calc(100% - 3rem)); border: 1px solid rgb(255 255 255 / 16%); background: rgb(16 19 59 / 92%); padding: 1.35rem; backdrop-filter: blur(14px); }
          .space-explorer-v2__hotspot-card strong { display: block; margin: .55rem 0; font-family: var(--font-editorial); font-size: 1.8rem; font-weight: 400; }
          .space-explorer-v2__hotspot-card p { margin: 0 0 .7rem; color: rgb(255 255 255 / 68%); font-size: .82rem; line-height: 1.65; }
          .space-explorer-v2__hotspot-card small { color: var(--color-teal); font-size: .68rem; font-weight: 700; }
          .space-explorer-v2__hotspot-card > button { float: right; border: 0; background: transparent; color: rgb(255 255 255 / 65%); font-size: .68rem; cursor: pointer; }
          .space-explorer-v2__scenes { position: absolute; z-index: 7; right: clamp(1rem, 2.5vw, 2rem); bottom: 5.6rem; display: flex; gap: .45rem; max-width: min(48rem, calc(100% - 3rem)); overflow-x: auto; }
          .space-explorer-v2__scenes button { display: grid; grid-template-columns: auto minmax(4rem, 1fr); align-items: center; gap: .65rem; min-height: 3rem; border: 1px solid rgb(255 255 255 / 18%); background: rgb(16 19 59 / 76%); padding: .55rem .75rem; color: #fff; text-align: left; cursor: pointer; backdrop-filter: blur(10px); }
          .space-explorer-v2__scenes button[aria-pressed='true'] { border-color: var(--color-teal); background: rgb(16 19 59 / 92%); }
          .space-explorer-v2__scenes span { color: var(--color-teal); font-size: .58rem; font-weight: 850; }
          .space-explorer-v2__scenes strong { overflow: hidden; max-width: 11rem; font-size: .68rem; text-overflow: ellipsis; white-space: nowrap; }
          .space-explorer-v2__controls { position: absolute; z-index: 8; right: clamp(1rem, 2.5vw, 2rem); bottom: 1.5rem; display: flex; gap: .45rem; }
          .space-explorer-v2__controls button { display: grid; width: 2.9rem; height: 2.9rem; place-items: center; border: 1px solid rgb(255 255 255 / 22%); border-radius: 50%; background: rgb(16 19 59 / 78%); color: #fff; cursor: pointer; }
          .space-explorer-v2__controls button:hover:not(:disabled) { border-color: var(--color-teal); background: var(--color-teal); color: var(--color-deep-navy); }
          .space-explorer-v2__controls button:disabled { opacity: .34; cursor: not-allowed; }
          .space-explorer-v2__hint { position: absolute; z-index: 6; bottom: 2rem; left: clamp(1.5rem, 4vw, 3.5rem); display: flex; align-items: center; gap: .5rem; color: rgb(255 255 255 / 54%); font-size: .66rem; }
          .space-explorer-v2__info { position: absolute; z-index: 30; top: 4.4rem; right: 0; bottom: 0; width: min(31rem, 42vw); border-left: 1px solid var(--color-border); background: #fbfaf6; color: var(--color-deep-navy); padding: clamp(2rem, 4vw, 4rem); box-shadow: -2rem 0 5rem rgb(5 7 25 / 22%); overflow-y: auto; }
          .space-explorer-v2__info > button { float: right; min-height: var(--touch-target); border: 0; background: transparent; color: var(--color-muted); font-size: .7rem; cursor: pointer; }
          .space-explorer-v2__info h2 { clear: both; margin: 2rem 0 1rem; font-family: var(--font-editorial); font-size: 3.1rem; font-weight: 400; line-height: .98; }
          .space-explorer-v2__info p { color: var(--color-muted); line-height: 1.8; }
          .space-explorer-v2__info > div { display: flex; justify-content: space-between; gap: 1rem; border-top: 1px solid var(--color-border); padding: .9rem 0; }
          .space-explorer-v2__info small { color: var(--color-muted); }
          .space-explorer-v2__info .ds-button { width: 100%; margin-top: 1.5rem; border-radius: 999px; }

          .space-config-v2__header { padding-block: clamp(3rem, 6vw, 6rem) 3rem; }
          .space-config-v2__header > div { margin-top: 3rem; }
          .space-config-v2__header h1 { max-width: 10ch; margin: .8rem 0 1rem; color: var(--color-deep-navy); font-family: var(--font-editorial); font-size: clamp(4rem, 7vw, 7rem); font-weight: 400; line-height: .92; }
          .space-config-v2__header h1 em { color: var(--color-teal); font-weight: 400; }
          .space-config-v2__header p { max-width: 43rem; color: var(--color-muted); line-height: 1.8; }
          .space-config-v2__layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(20rem, .75fr); gap: clamp(3rem, 7vw, 7rem); align-items: start; padding-bottom: clamp(7rem, 10vw, 10rem); }
          .space-config-v2__controls { border-top: 1px solid var(--scene-line); }
          .space-config-v2__section { border-bottom: 1px solid var(--scene-line); padding: 2.4rem 0; }
          .space-config-v2__section-title { display: grid; grid-template-columns: 3rem 1fr; gap: 1rem; }
          .space-config-v2__section-title > span { color: var(--color-teal); font-size: .64rem; font-weight: 850; letter-spacing: .12em; }
          .space-config-v2__section-title h2 { margin: 0; color: var(--color-deep-navy); font-family: var(--font-editorial); font-size: clamp(2rem, 3vw, 3rem); font-weight: 400; }
          .space-config-v2__section-title p { margin: .5rem 0 0; color: var(--color-muted); font-size: .82rem; }
          .space-config-v2__purpose { display: grid; grid-template-columns: repeat(2, 1fr); gap: .65rem; margin: 1.8rem 0 0 4rem; }
          .space-config-v2__purpose button { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .7rem; min-height: 4.3rem; border: 1px solid var(--color-border); background: #fff; padding: .8rem 1rem; color: var(--color-deep-navy); text-align: left; cursor: pointer; transition: border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard); }
          .space-config-v2__purpose button:hover { border-color: rgb(34 187 174 / 55%); }
          .space-config-v2__purpose button.is-selected { border-color: var(--color-teal); background: rgb(34 187 174 / 8%); box-shadow: inset 0 0 0 1px var(--color-teal); }
          .space-config-v2__purpose button > span { font-weight: 750; }
          .space-config-v2__people { display: grid; gap: .5rem; margin: 1.8rem 0 0 4rem; max-width: 17rem; }
          .space-config-v2__people > span { font-size: .72rem; font-weight: 750; }
          .space-config-v2__people input { min-height: 3.5rem; border: 1px solid var(--color-border); background: #fff; padding: .6rem .8rem; font-family: var(--font-editorial); font-size: 1.5rem; }
          .space-config-v2__people input:focus-visible { border-color: var(--color-teal); outline: 0; box-shadow: var(--focus-ring); }
          .space-config-v2__people input[aria-invalid='true'] { border-color: var(--color-danger); }
          .space-config-v2__people small { color: var(--color-danger); }
          .space-config-v2__pending { opacity: .72; }
          .space-config-v2__pending-label { display: inline-block; margin-top: .9rem; color: var(--color-muted); font-size: .6rem; font-weight: 850; letter-spacing: .12em; }
          .space-config-v2__summary { position: sticky; top: 7.2rem; border: 1px solid var(--color-border); background: #fff; padding: clamp(1.4rem, 3vw, 2.5rem); }
          .space-config-v2__visual { position: relative; min-height: 14rem; margin: calc(clamp(1.4rem, 3vw, 2.5rem) * -1) calc(clamp(1.4rem, 3vw, 2.5rem) * -1) 2rem; overflow: hidden; background: var(--scene-warm-strong); isolation: isolate; }
          .space-config-v2__visual.has-media::after { content: ''; position: absolute; z-index: 2; inset: 0; background: linear-gradient(180deg, transparent 40%, rgb(16 19 59 / 64%)); pointer-events: none; }
          .space-config-v2__image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
          .space-config-v2__media-empty { position: absolute; inset: 1.35rem; border: 1px solid var(--scene-line-strong); background: var(--scene-warm); }
          .space-config-v2__media-overlay { position: absolute; z-index: 4; right: 1rem; bottom: .9rem; left: 1rem; display: flex; justify-content: space-between; gap: .7rem; border-top: 1px solid rgb(23 24 79 / 20%); padding-top: .55rem; color: var(--color-deep-navy); }
          .space-config-v2__visual.has-media .space-config-v2__media-overlay { border-top-color: rgb(255 255 255 / 42%); color: #fff; }
          .space-config-v2__media-overlay span { font-size: .56rem; font-weight: 850; letter-spacing: .12em; }
          .space-config-v2__media-overlay small { font-size: .56rem; opacity: .72; text-align: right; }
          .space-config-v2__summary h2 { margin: .7rem 0 1.2rem; color: var(--color-deep-navy); font-family: var(--font-editorial); font-size: 2.6rem; font-weight: 400; line-height: 1; }
          .space-config-v2__summary dl { margin: 0 0 1.5rem; border-top: 1px solid var(--color-border); }
          .space-config-v2__summary dl > div { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px solid var(--color-border); padding: .8rem 0; }
          .space-config-v2__summary dt { color: var(--color-muted); font-size: .72rem; }
          .space-config-v2__summary dd { margin: 0; color: var(--color-deep-navy); font-size: .75rem; font-weight: 750; text-align: right; }
          .space-config-v2__summary .ds-button { width: 100%; border-radius: 999px; }
          .space-config-v2__summary > small { display: block; margin-top: .8rem; color: var(--color-muted); font-size: .66rem; text-align: center; }

          '''
          css = css[:css_start] + core + css[css_end:]
          css = css.replace("  .space-explorer-v2__info { top: auto; right: 0; bottom: 0; left: 0; width: auto; max-height: 78vh; transform: translateY(102%); border-top: 1px solid var(--color-border); border-left: 0; overflow-y: auto; }\n  .space-explorer-v2__info--open { transform: translateY(0); }", "  .space-explorer-v2__info { top: auto; right: 0; bottom: 0; left: 0; width: auto; max-height: 78vh; border-top: 1px solid var(--color-border); border-left: 0; overflow-y: auto; }\n  .space-explorer-v2__scenes { right: var(--page-padding); left: var(--page-padding); bottom: 5rem; max-width: none; }\n  .space-explorer-v2__hotspot-card { left: var(--page-padding); bottom: 9rem; width: calc(100% - (var(--page-padding) * 2)); }", 1)
          css = css.replace("  .space-config-v2__preview { margin: -2rem calc(var(--page-padding) * -1) 2rem; }", "  .space-config-v2__visual { margin: -2rem calc(var(--page-padding) * -1) 2rem; }", 1)
          css = css.replace("@media (prefers-reduced-motion: reduce) {\n  .space-explorer-v2__info { transition: none !important; }\n}", "@media (prefers-reduced-motion: reduce) {\n  .space-explorer-v2__panorama, .space-config-v2__purpose button { transition: none !important; }\n}", 1)
          css_path.write_text(css, encoding='utf-8')

          Path('.github/workflows/public-spaces-explorer-configurator.yml').unlink()
