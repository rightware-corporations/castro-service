name: Public Spaces Explorer Configurator V2

on:
  push:
    branches:
      - feat/public-spaces-explorer-configurator

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/public-spaces-explorer-configurator
          fetch-depth: 0

      - name: Prepare corrected implementation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/public-spaces-explorer-configurator.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index("\n          PY", start)
          script = source[start:end]

          bad_effect = "            useEffect(() => { setActiveHotspotId('') }, [sceneId])\n"
          if bad_effect not in script:
              raise SystemExit('Expected hotspot reset effect not found in source workflow')
          script = script.replace(bad_effect, '', 1)

          old_select = "            const selectScene = (id: string) => { setSelectedSceneId(id); setZoom(1) }\n"
          new_select = "            const selectScene = (id: string) => { setSelectedSceneId(id); setActiveHotspotId(''); setZoom(1) }\n"
          if old_select not in script:
              raise SystemExit('Expected selectScene transition not found in source workflow')
          script = script.replace(old_select, new_select, 1)

          script = script.replace("          Path('.github/workflows/public-spaces-explorer-configurator.yml').unlink()\n", '', 1)
          Path('/tmp/public-spaces-implementation.py').write_text(textwrap.dedent(script), encoding='utf-8')
          PY

      - name: Implement Explorer and Configurator
        run: python /tmp/public-spaces-implementation.py

      - name: Verify diff hygiene
        run: |
          git diff --check
          git status --short

      - name: Frontend gates
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "rightware-corporations"
          git config user.email "rightware123@gmail.com"
          git add frontend/src/features/spaces/components/SpacesPublic.tsx frontend/src/features/spaces/components/SpacesPublic.test.tsx frontend/src/styles/spaces-v2.css
          git commit -m "feat(frontend): refine spaces explorer and configurator"
          git push origin HEAD:feat/public-spaces-explorer-configurator
