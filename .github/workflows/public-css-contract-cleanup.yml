name: Public CSS Contract Cleanup

on:
  push:
    branches:
      - refactor/public-css-contract-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/public-css-contract-cleanup
          fetch-depth: 0

      - name: Remove confirmed superseded public CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/styles/public-v2.css')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '.public-v2-shell .container { max-width: 1320px; }\n',
                  '',
              ),
              (
                  ".home-v2-orbit {\n"
                  "  position: absolute;\n"
                  "  border: 1px solid rgb(23 24 79 / 22%);\n"
                  "  border-radius: 50%;\n"
                  "}\n"
                  ".home-v2-orbit--one { width: 34rem; height: 34rem; right: -11rem; top: -8rem; }\n"
                  ".home-v2-orbit--two { width: 23rem; height: 23rem; left: -9rem; bottom: -6rem; border-color: rgb(34 187 174 / 32%); }\n"
                  ".home-v2-node { position: absolute; z-index: 2; width: 1.05rem; height: 1.05rem; border-radius: 50%; background: var(--color-teal); box-shadow: 0 0 0 7px rgb(34 187 174 / 14%); }\n"
                  ".home-v2-node--a { top: 19%; right: 25%; }\n"
                  ".home-v2-node--b { top: 55%; left: 18%; background: var(--color-navy); box-shadow: 0 0 0 7px rgb(23 24 79 / 10%); }\n"
                  ".home-v2-node--c { bottom: 14%; right: 18%; background: var(--color-green); box-shadow: 0 0 0 7px rgb(100 201 138 / 16%); }\n",
                  '',
              ),
              (
                  ".home-v2-hero__scroll { display: flex; align-items: center; justify-content: flex-end; gap: .45rem; padding-block: .9rem; color: rgb(32 35 42 / 52%); font-size: .65rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }\n",
                  '',
              ),
              (
                  "  .home-v2-hero__scroll { display: none; }\n",
                  '',
              ),
              (
                  "\n@media (prefers-reduced-motion: reduce) {\n"
                  "  .home-v2-link svg, .home-v2-experience, .public-v2-shell .public-nav a::after { transition: none !important; }\n"
                  "}\n",
                  '\n',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected cleanup target not found:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text.rstrip() + '\n', encoding='utf-8')

          workflow = Path('.github/workflows/public-css-contract-cleanup.yml')
          workflow.unlink()
          PY

      - name: Verify diff hygiene
        run: |
          git diff --check
          git status --short
          git diff -- frontend/src/styles/public-v2.css

      - name: Commit cleanup
        run: |
          git config user.name "rightware-corporations"
          git config user.email "rightware123@gmail.com"
          git add frontend/src/styles/public-v2.css .github/workflows/public-css-contract-cleanup.yml
          git commit -m "refactor(styles): remove superseded public CSS rules"
          git push origin HEAD:refactor/public-css-contract-cleanup
