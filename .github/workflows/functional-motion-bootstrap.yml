name: Functional Motion Bootstrap

on:
  push:
    branches:
      - feat/functional-motion-foundation

permissions:
  contents: write

jobs:
  install-motion:
    name: Install approved Motion dependency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/functional-motion-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Motion only
        working-directory: frontend
        run: npm install motion@13.2.0 --save-exact

      - name: Commit dependency lock and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/functional-motion-bootstrap.yml
          git add frontend/package.json frontend/package-lock.json
          git commit -m "feat(frontend): add approved motion dependency"
          git push origin HEAD:feat/functional-motion-foundation
