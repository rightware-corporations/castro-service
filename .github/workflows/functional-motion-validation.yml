name: Functional Motion Validation

on:
  push:
    branches:
      - feat/functional-motion-foundation

permissions:
  contents: read

concurrency:
  group: functional-motion-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-baseline:
    name: Dependency baseline validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Motion version
        run: npm ls motion
      - name: Build dependency baseline
        run: npm run build
