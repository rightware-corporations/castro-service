name: Functional Motion Validation

on:
  push:
    branches:
      - feat/functional-motion-foundation

permissions:
  contents: read

concurrency:
  group: functional-motion-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-motion-gates:
    name: Frontend motion gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify approved Motion dependency
        run: |
          npm ls motion
          node -e "const p=require('./package.json'); if(p.dependencies.motion!=='13.2.0') process.exit(1)"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Record production bundle metrics
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const zlib = require('zlib')
          const root = path.join(process.cwd(), 'dist', 'assets')
          const files = fs.readdirSync(root).filter((name) => /\.(js|css)$/.test(name)).sort()
          const rows = files.map((name) => {
            const buffer = fs.readFileSync(path.join(root, name))
            return { name, ext: path.extname(name).slice(1), bytes: buffer.length, gzip: zlib.gzipSync(buffer).length }
          })
          const sum = (ext, field) => rows.filter((row) => row.ext === ext).reduce((total, row) => total + row[field], 0)
          const report = [
            `JS_BYTES=${sum('js', 'bytes')}`,
            `JS_GZIP_BYTES=${sum('js', 'gzip')}`,
            `CSS_BYTES=${sum('css', 'bytes')}`,
            `CSS_GZIP_BYTES=${sum('css', 'gzip')}`,
            '',
            ...rows.map((row) => `${row.name}\t${row.bytes}\t${row.gzip}`),
          ].join('\n')
          fs.writeFileSync('motion-validation-metrics.txt', report + '\n')
          console.log(report)
          NODE
      - name: Upload bundle metrics
        uses: actions/upload-artifact@v4
        with:
          name: functional-motion-bundle-metrics
          path: frontend/motion-validation-metrics.txt
          if-no-files-found: error
          retention-days: 7
