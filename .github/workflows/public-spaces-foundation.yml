name: Public Spaces Foundation

on:
  push:
    branches:
      - feat/public-spaces-foundation

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/public-spaces-foundation
          fetch-depth: 0

      - name: Implement public Spaces media foundation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('frontend/src/features/spaces/components/SpacesPublic.tsx')
          text = component.read_text(encoding='utf-8')

          old_catalog = '''function SpaceCatalogItem({ space, index }: { space: Space; index: number }) {
            return <article className="space-v2-card">
              <div className="space-v2-card__visual" aria-hidden="true"><span>{String(index + 1).padStart(2, '0')}</span><div className="space-v2-card__room"><i /><i /><i /></div><small>MEDIA PUBLICADA NO EXPLORADOR</small></div>
              <div className="space-v2-card__content">
                <div className="space-v2-card__meta"><span>ESPAÇO</span>{space.location && <span><MapPin size={14} />{space.location}</span>}</div>
                <h2>{space.name}</h2>
                {space.description && <p>{space.description}</p>}
                <div className="space-v2-card__facts">{space.capacityMin !== undefined || space.capacityMax !== undefined ? <span><UsersRound size={16} />{formatCapacity(space)}</span> : <span><UsersRound size={16} />Capacidade a confirmar</span>}</div>
                <div className="space-v2-card__actions"><Link className="ds-button ds-button--primary" to={`/espacos/${space.slug}`}>Conhecer espaço <ArrowRight size={16} /></Link><Link className="home-v2-link" to={`/espacos/${space.slug}/explorar`}>Explorar <Eye size={16} /></Link></div>
              </div>
            </article>
          }
          '''

          new_catalog = '''function SpaceMediaPreview({ space, index, variant }: { space: Space; index?: number; variant: 'catalog' | 'detail' }) {
            const scenes = useQuery({
              queryKey: ['public', 'spaces', space.id, 'scenes'],
              queryFn: () => spacePublicExperience.listScenes(space.id),
              enabled: Boolean(space.id),
              staleTime: 5 * 60 * 1000,
            })
            const scene = scenes.data?.[0]
            const prefix = variant === 'detail' ? 'space-detail-v2' : 'space-v2-card'
            const sceneCount = scenes.data?.length ?? 0
            const status = scenes.isLoading
              ? 'A preparar pré-visualização'
              : scenes.isError
                ? 'Pré-visualização indisponível'
                : scene
                  ? `${sceneCount} ${sceneCount === 1 ? 'cena publicada' : 'cenas publicadas'}`
                  : 'Imagem a publicar'
            const label = variant === 'detail' ? 'EXPERIÊNCIA ESPACIAL' : `ESPAÇO ${String((index ?? 0) + 1).padStart(2, '0')}`

            return <div className={`${prefix}__visual ${scene ? 'has-media' : 'is-empty'}`} aria-label={`Pré-visualização de ${space.name}`}>
              {scene ? <img className={`${prefix}__image`} src={scene.panoramaUrl} alt={scene.title ? `${scene.title} — ${space.name}` : `Vista panorâmica de ${space.name}`} loading={variant === 'detail' ? 'eager' : 'lazy'} draggable={false} /> : <div className={`${prefix}__media-empty`} aria-hidden="true" />}
              <div className={`${prefix}__media-overlay`}><span>{label}</span><small>{status}</small></div>
            </div>
          }

          function SpaceCatalogItem({ space, index }: { space: Space; index: number }) {
            const summary = space.summary ?? space.description
            return <article className="space-v2-card">
              <SpaceMediaPreview space={space} index={index} variant="catalog" />
              <div className="space-v2-card__content">
                <div className="space-v2-card__meta"><span>ESPAÇO</span>{space.location && <span><MapPin size={14} />{space.location}</span>}</div>
                <h2>{space.name}</h2>
                {summary && <p>{summary}</p>}
                <div className="space-v2-card__facts">{space.capacityMin !== undefined || space.capacityMax !== undefined ? <span><UsersRound size={16} />{formatCapacity(space)}</span> : <span><UsersRound size={16} />Capacidade a confirmar</span>}</div>
                <div className="space-v2-card__actions"><Link className="ds-button ds-button--primary" to={`/espacos/${space.slug}`}>Conhecer espaço <ArrowRight size={16} /></Link><Link className="home-v2-link" to={`/espacos/${space.slug}/explorar`}>Explorar <Eye size={16} /></Link></div>
              </div>
            </article>
          }
          '''

          if old_catalog not in text:
              raise SystemExit('Expected SpaceCatalogItem block not found')
          text = text.replace(old_catalog, new_catalog, 1)

          old_detail_stage = '''      <div className="space-detail-v2__stage"><div className="space-detail-v2__visual" aria-label="Área de apresentação do espaço"><div className="space-detail-v2__architecture" aria-hidden="true"><span /><span /><span /><i /><i /></div><div className="space-detail-v2__visual-label"><strong>EXPERIÊNCIA ESPACIAL</strong><small>As cenas panorâmicas publicadas podem ser abertas no explorador.</small></div></div><aside className="space-detail-v2__panel"><span className="eyebrow">INFORMAÇÃO</span><h2>Prepare o encontro antes de chegar.</h2><div className="space-detail-v2__facts"><div><small>Capacidade</small><strong>{formatCapacity(space)}</strong></div>{space.location && <div><small>Localização</small><strong>{space.location}</strong></div>}</div><Link className="ds-button ds-button--primary" to={`/espacos/${space.slug}/explorar`}>Explorar espaço <Eye size={17} /></Link><Link className="ds-button ds-button--secondary" to={`/espacos/${space.slug}/configurar`}>Configurar encontro <ArrowRight size={17} /></Link></aside></div>
          '''
          new_detail_stage = '''      <div className="space-detail-v2__stage"><SpaceMediaPreview space={space} variant="detail" /><aside className="space-detail-v2__panel"><span className="eyebrow">INFORMAÇÃO</span><h2>Prepare o encontro antes de chegar.</h2><div className="space-detail-v2__facts"><div><small>Capacidade</small><strong>{formatCapacity(space)}</strong></div>{space.location && <div><small>Localização</small><strong>{space.location}</strong></div>}</div><Link className="ds-button ds-button--primary" to={`/espacos/${space.slug}/explorar`}>Explorar espaço <Eye size={17} /></Link><Link className="ds-button ds-button--secondary" to={`/espacos/${space.slug}/configurar`}>Configurar encontro <ArrowRight size={17} /></Link></aside></div>
          '''
          if old_detail_stage not in text:
              raise SystemExit('Expected SpaceDetail stage not found')
          text = text.replace(old_detail_stage, new_detail_stage, 1)
          component.write_text(text, encoding='utf-8')

          test = Path('frontend/src/features/spaces/components/SpacesPublic.test.tsx')
          test_text = test.read_text(encoding='utf-8')
          test_text = test_text.replace("import { render, screen } from '@testing-library/react'\n", "import { QueryClient, QueryClientProvider } from '@tanstack/react-query'\nimport { render, screen } from '@testing-library/react'\n", 1)
          marker = "const space = {\n  id: 'space-1',\n  slug: 'sala-reuniao',\n  name: 'Sala de Reunião',\n  description: 'Espaço publicado para reuniões.',\n  location: 'Maputo',\n  capacityMin: 2,\n  capacityMax: 10,\n}\n\n"
          helper = marker + "function renderWithQuery(element: React.ReactElement) {\n  const queryClient = new QueryClient({ defaultOptions: { queries: { retry: false } } })\n  return render(<QueryClientProvider client={queryClient}>{element}</QueryClientProvider>)\n}\n\n"
          if marker not in test_text:
              raise SystemExit('Expected test marker not found')
          test_text = test_text.replace(marker, helper, 1)
          test_text = test_text.replace('    render(<MemoryRouter><SpacesCatalog /></MemoryRouter>)', '    renderWithQuery(<MemoryRouter><SpacesCatalog /></MemoryRouter>)', 1)
          test_text = test_text.replace("    render(<MemoryRouter initialEntries={['/espacos/sala-reuniao']}><SpaceDetail /></MemoryRouter>)", "    renderWithQuery(<MemoryRouter initialEntries={['/espacos/sala-reuniao']}><SpaceDetail /></MemoryRouter>)", 1)
          test.write_text(test_text, encoding='utf-8')

          styles = Path('frontend/src/styles/spaces-v2.css')
          css = styles.read_text(encoding='utf-8')

          old_card_media = '''.space-v2-card { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(20rem, .85fr); min-height: 37rem; background: #fff; box-shadow: 0 2rem 5rem rgb(16 19 59 / 6%); }
          .space-v2-card:nth-child(even) .space-v2-card__visual { order: 2; }
          .space-v2-card__visual { position: relative; overflow: hidden; background: linear-gradient(145deg, #ddd4be, var(--color-cream) 54%, #cfc8b7); }
          .space-v2-card__visual::before { content: ''; position: absolute; inset: 11%; border: 1px solid rgb(23 24 79 / 20%); }
          .space-v2-card__visual > span { position: absolute; z-index: 4; top: 1.5rem; left: 1.5rem; color: var(--color-deep-navy); font-size: .68rem; font-weight: 850; letter-spacing: .13em; }
          .space-v2-card__visual > small { position: absolute; z-index: 4; right: 1.5rem; bottom: 1.5rem; color: rgb(23 24 79 / 53%); font-size: .58rem; font-weight: 800; letter-spacing: .12em; }
          .space-v2-card__room { position: absolute; inset: 20% 16% 18%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8%; border-bottom: 1px solid rgb(23 24 79 / 24%); transform: perspective(700px) rotateY(-4deg); }
          .space-v2-card__room::before, .space-v2-card__room::after { content: ''; position: absolute; border: 1px solid rgb(23 24 79 / 20%); }
          .space-v2-card__room::before { inset: -7% 3% 5% -5%; }
          .space-v2-card__room::after { width: 36%; height: 25%; right: -7%; bottom: 7%; }
          .space-v2-card__room i { align-self: stretch; border: 1px solid rgb(23 24 79 / 25%); background: rgb(255 255 255 / 14%); }
          '''
          new_card_media = '''.space-v2-card { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(20rem, .85fr); min-height: 37rem; background: #fff; box-shadow: var(--scene-shadow); }
          .space-v2-card:nth-child(even) .space-v2-card__visual { order: 2; }
          .space-v2-card__visual { position: relative; min-height: 37rem; overflow: hidden; background: var(--scene-warm-strong); isolation: isolate; }
          .space-v2-card__visual.has-media::after { content: ''; position: absolute; z-index: 2; inset: 0; background: linear-gradient(180deg, rgb(16 19 59 / 5%), rgb(16 19 59 / 2%) 48%, rgb(16 19 59 / 68%)); pointer-events: none; }
          .space-v2-card__image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
          .space-v2-card__media-empty { position: absolute; inset: clamp(1.5rem, 4vw, 3rem); border: 1px solid var(--scene-line-strong); background: linear-gradient(145deg, var(--scene-warm), rgb(255 255 255 / 38%)); }
          .space-v2-card__media-empty::after { content: ''; position: absolute; right: 10%; bottom: 12%; width: 28%; height: 1px; background: var(--scene-line-strong); }
          .space-v2-card__media-overlay { position: absolute; z-index: 4; right: 1.6rem; bottom: 1.5rem; left: 1.6rem; display: flex; align-items: end; justify-content: space-between; gap: 1rem; border-top: 1px solid rgb(23 24 79 / 22%); padding-top: .9rem; color: var(--color-deep-navy); }
          .space-v2-card__visual.has-media .space-v2-card__media-overlay { border-top-color: rgb(255 255 255 / 42%); color: #fff; }
          .space-v2-card__media-overlay span { font-size: .64rem; font-weight: 850; letter-spacing: .14em; }
          .space-v2-card__media-overlay small { max-width: 18rem; font-size: .62rem; text-align: right; opacity: .72; }
          '''
          if old_card_media not in css:
              raise SystemExit('Expected catalog media CSS not found')
          css = css.replace(old_card_media, new_card_media, 1)

          old_detail_media = '''.space-detail-v2__stage { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(21rem, .75fr); min-height: 42rem; background: #fff; box-shadow: 0 2rem 5rem rgb(16 19 59 / 6%); }
          .space-detail-v2__visual { position: relative; overflow: hidden; background: linear-gradient(145deg, #d9d0bb, #f1dfaf 52%, #cbc4b2); }
          .space-detail-v2__architecture { position: absolute; inset: 16% 12% 18%; display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 6%; perspective: 650px; }
          .space-detail-v2__architecture span { border: 1px solid rgb(23 24 79 / 24%); background: rgb(255 255 255 / 12%); }
          .space-detail-v2__architecture i { position: absolute; width: 1rem; height: 1rem; border-radius: 50%; background: var(--color-teal); box-shadow: 0 0 0 7px rgb(34 187 174 / 14%); }
          .space-detail-v2__architecture i:nth-of-type(1) { top: 22%; left: 25%; }
          .space-detail-v2__architecture i:nth-of-type(2) { right: 20%; bottom: 20%; background: var(--color-green); }
          .space-detail-v2__visual-label { position: absolute; right: 1.6rem; bottom: 1.5rem; left: 1.6rem; display: flex; justify-content: space-between; gap: 1rem; border-top: 1px solid rgb(23 24 79 / 22%); padding-top: .9rem; }
          .space-detail-v2__visual-label strong { color: var(--color-deep-navy); font-size: .65rem; letter-spacing: .14em; }
          .space-detail-v2__visual-label small { max-width: 21rem; color: rgb(23 24 79 / 58%); text-align: right; }
          '''
          new_detail_media = '''.space-detail-v2__stage { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(21rem, .75fr); min-height: 42rem; background: #fff; box-shadow: var(--scene-shadow); }
          .space-detail-v2__visual { position: relative; min-height: 42rem; overflow: hidden; background: var(--scene-warm-strong); isolation: isolate; }
          .space-detail-v2__visual.has-media::after { content: ''; position: absolute; z-index: 2; inset: 0; background: linear-gradient(180deg, rgb(16 19 59 / 4%), transparent 48%, rgb(16 19 59 / 70%)); pointer-events: none; }
          .space-detail-v2__image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
          .space-detail-v2__media-empty { position: absolute; inset: clamp(1.75rem, 4vw, 3.5rem); border: 1px solid var(--scene-line-strong); background: linear-gradient(145deg, var(--scene-warm), rgb(255 255 255 / 42%)); }
          .space-detail-v2__media-empty::after { content: ''; position: absolute; right: 10%; bottom: 12%; width: 32%; height: 1px; background: var(--scene-line-strong); }
          .space-detail-v2__media-overlay { position: absolute; z-index: 4; right: 1.6rem; bottom: 1.5rem; left: 1.6rem; display: flex; justify-content: space-between; gap: 1rem; border-top: 1px solid rgb(23 24 79 / 22%); padding-top: .9rem; color: var(--color-deep-navy); }
          .space-detail-v2__visual.has-media .space-detail-v2__media-overlay { border-top-color: rgb(255 255 255 / 42%); color: #fff; }
          .space-detail-v2__media-overlay span { font-size: .65rem; font-weight: 850; letter-spacing: .14em; }
          .space-detail-v2__media-overlay small { max-width: 21rem; font-size: .65rem; text-align: right; opacity: .72; }
          '''
          if old_detail_media not in css:
              raise SystemExit('Expected detail media CSS not found')
          css = css.replace(old_detail_media, new_detail_media, 1)
          css = css.replace('  .space-detail-v2__visual-label { flex-direction: column; }\n  .space-detail-v2__visual-label small { text-align: left; }', '  .space-detail-v2__media-overlay { flex-direction: column; }\n  .space-detail-v2__media-overlay small { text-align: left; }', 1)
          styles.write_text(css, encoding='utf-8')

          Path('.github/workflows/public-spaces-foundation.yml').unlink()
          PY

      - name: Verify diff hygiene
        run: |
          git diff --check
          git status --short

      - name: Frontend gates
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Commit implementation
        run: |
          git config user.name "rightware-corporations"
          git config user.email "rightware123@gmail.com"
          git add frontend/src/features/spaces/components/SpacesPublic.tsx frontend/src/features/spaces/components/SpacesPublic.test.tsx frontend/src/styles/spaces-v2.css .github/workflows/public-spaces-foundation.yml
          git commit -m "feat(frontend): establish professional public spaces media experience"
          git push origin HEAD:feat/public-spaces-foundation
