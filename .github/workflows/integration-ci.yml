name: Integration CI

on:
  push:
    branches:
      - main
      - integration/castros-platform
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Verify
        run: ./mvnw -B clean verify

  postgres-integration:
    name: PostgreSQL integration gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: castros_it
          POSTGRES_USER: castros
          POSTGRES_PASSWORD: castros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U castros -d castros_it"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      CASTROS_RUN_POSTGRES_IT: 'true'
      CASTROS_IT_DATABASE_URL: jdbc:postgresql://localhost:5432/castros_it
      CASTROS_IT_DATABASE_USERNAME: castros
      CASTROS_IT_DATABASE_PASSWORD: castros
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '4'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Run mandatory PostgreSQL security and regression suite
        run: ./mvnw -B '-Dtest=*IntegrationTest' test
      - name: Print PostgreSQL test reports on failure
        if: failure()
        run: |
          echo "::group::Surefire reports"
          if [ -d target/surefire-reports ]; then
            find target/surefire-reports -maxdepth 1 -type f \( -name '*.txt' -o -name '*.xml' \) -print0 | sort -z | while IFS= read -r -d '' file; do
              echo "===== $file ====="
              cat "$file"
            done
          else
            echo "No Surefire reports found."
          fi
          echo "::endgroup::"
      - name: Upload PostgreSQL test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
