spring:
  application.name: castros-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/castros}
    username: ${DATABASE_USERNAME:castros}
    password: ${DATABASE_PASSWORD:castros}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
  session:
    timeout: ${SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
management:
  endpoints.web.exposure.include: health,readiness
  endpoint.health.probes.enabled: true
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
castros:
  business-timezone: ${BUSINESS_TIMEZONE:Africa/Maputo}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  availability-development-fallback: ${AVAILABILITY_DEVELOPMENT_FALLBACK:false}
  production-mode: ${PRODUCTION_MODE:false}
  trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
  login-rate-limit-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:10}
  public-mutation-rate-limit-per-minute: ${PUBLIC_MUTATION_RATE_LIMIT_PER_MINUTE:30}
server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
